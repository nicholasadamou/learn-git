repos:
  - repo: local
    hooks:
      - id: checks
        name: Lint, types, docs, LOC, and workflows (Flox)
        entry: flox activate -- bun run check
        language: system
        pass_filenames: false
        always_run: true
      - id: build
        name: Production build and smoke checks (Flox)
        entry: flox activate -- bun run verify
        language: system
        pass_filenames: false
        always_run: true
