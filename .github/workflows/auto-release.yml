name: auto-release

on:
  workflow_run:
    workflows: [ci]
    branches: [master]
    types: [completed]

concurrency:
  group: auto-release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cut-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag tested commit and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          if [ "$(git rev-parse origin/master)" != "$TESTED_SHA" ]; then
            echo "Skipping superseded CI run"
            exit 0
          fi
          tag="$(git tag --points-at "$TESTED_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            latest="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$latest" ]; then
              tag=v0.1.0
            else
              tag="${latest%.*}.$((${latest##*.} + 1))"
            fi
            git tag "$tag" "$TESTED_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          fi
