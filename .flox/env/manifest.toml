schema-version = "1.18.0"

[install]
bun.pkg-path = "bun"
nodejs_22.pkg-path = "nodejs_22"
actionlint.pkg-path = "actionlint"
pre-commit.pkg-path = "pre-commit"

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]

[vars]
NEXT_TELEMETRY_DISABLED = "1"

[hook]
on-activate = '''
  cd "$FLOX_ENV_PROJECT"
  bun install --frozen-lockfile || return 1
  if [ -z "${CI:-}" ] && [ -d .git ]; then
    pre-commit install --install-hooks || return 1
  fi
'''

[services.web]
command = "bun run dev"
